---
# Call the Renovate workflow for the entire organization.
name: Trigger Renovate

on:
  workflow_call:
    secrets:
      APPLICATION_ID:
        description: >-
          GitHub App ID. Only used when the caller has no
          APPLICATION_CLIENT_ID variable.
        required: false
      APPLICATION_PRIVATE_KEY:
        description: GitHub App private key
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trigger-org-renovate:
    name: Trigger Renovate
    runs-on: ubuntu-latest
    steps:
      - id: get-workflow-access-token
        if: vars.APPLICATION_CLIENT_ID != ''
        name: Get Workflow Access Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APPLICATION_CLIENT_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: get-workflow-access-token-legacy
        if: vars.APPLICATION_CLIENT_ID == ''
        name: Get Workflow Access Token (legacy app-id)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dispatch Renovate workflow in the .github repository
        env:
          GH_TOKEN: ${{ steps.get-workflow-access-token.outputs.token || steps.get-workflow-access-token-legacy.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          echo "Triggering workflow_dispatch for $ORG/.github"
          gh workflow run renovate.yaml --repo $ORG/.github
